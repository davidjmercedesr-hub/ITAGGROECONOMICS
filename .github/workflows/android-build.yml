name: Build KlarblattFarm Android

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify Android project
        run: test -f android/app/build.gradle && test -f android/settings.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build unsigned APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Archive Android project
        run: |
          mkdir -p artifacts
          tar -czf artifacts/KlarblattFarm-android-project.tar.gz android
          cp capacitor.config.ts artifacts/
          cp package.json artifacts/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KlarblattFarm-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: KlarblattFarm-Android-project
          path: artifacts/
          retention-days: 14
