services:
  app:
    build: .
    container_name: klarblattfarm-app
    expose:
      - "8787"
    environment:
      PORT: 8787
      USE_HTTPS: "false"
      GWDG_API_KEY: ${GWDG_API_KEY:-}
      GWDG_ARCANA_ID: ${GWDG_ARCANA_ID:-}
      GWDG_BASE_URL: ${GWDG_BASE_URL:-https://chat-ai.academiccloud.de/v1}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: klarblattfarm-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
